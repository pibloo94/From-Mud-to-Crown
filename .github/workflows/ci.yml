name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund 2>&1 | tee npm-install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm install::$(grep -E 'npm (error|ERR)' npm-install.log | head -25 | tr '\n' '|' )"
          fi
          exit $status
      - name: Tests
        run: npm test
      - name: Bot de equilibrio (partida corta)
        run: npm run balance
        env:
          BALANCE_DAYS: 300
          BALANCE_SEEDS: 1,2
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: from-mud-to-crown-web
          path: dist
